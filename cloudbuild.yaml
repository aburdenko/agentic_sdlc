steps:
  # Step 1: Calculate the Git Diff for the Pull Request
  - name: 'gcr.io/cloud-builders/git'
    id: 'calculate-diff'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        git fetch origin $_BASE_BRANCH
        git diff origin/$_BASE_BRANCH..HEAD > pr_diff.txt
        echo "=== PR Git Diff Generated ==="

  # Step 2: Invoke the Gemini Agent with the Diff Payload
  - name: 'python:3.11-slim'
    id: 'invoke-agent'
    entrypoint: 'bash'
    env:
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - 'GOOGLE_CLOUD_LOCATION=us-central1'
    args:
      - '-c'
      - |
        pip install google-genai --quiet
        python scripts/invoke_gemini_agent.py

  # Step 3: Run Python Script to Post Inline Review Comments on GitHub PR
  - name: 'python:3.11-slim'
    id: 'post-inline-comments'
    entrypoint: 'bash'
    secretEnv: ['GITHUB_TOKEN']
    args:
      - '-c'
      - |
        pip install requests --quiet
        export REPO_OWNER=$_REPO_OWNER
        export REPO_NAME=$_REPO_NAME
        export PR_NUMBER=$_PR_NUMBER
        export COMMIT_SHA=$REVISION_ID
        python scripts/post_inline_reviews.py

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: 'projects/kallogjeri-project-345114/secrets/github-token/versions/latest'
      env: 'GITHUB_TOKEN'

substitutions:
  _BASE_BRANCH: 'main'
  _REPO_OWNER: 'aburdenko'
  _REPO_NAME: 'agentic_sdlc'
  _PR_NUMBER: '1' # Provided dynamically by Cloud Build trigger metadata
  COMMIT_SHA: 'head_sha' # Provided dynamically by Cloud Build trigger metadata

